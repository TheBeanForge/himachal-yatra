<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Himachal Safar">
  <title>Himachal Safar — Summit Route mark</title>
  <defs>
    <linearGradient id="hsBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58ABEC"/>
      <stop offset="1" stop-color="#14528B"/>
    </linearGradient>
    <linearGradient id="hsPeak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9F4FE"/>
    </linearGradient>
    <linearGradient id="hsFacet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9ECFB"/>
      <stop offset="1" stop-color="#B3D7F3"/>
    </linearGradient>
    <clipPath id="hsClip"><rect width="64" height="64" rx="15"/></clipPath>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#hsBg)"/>

  <g clip-path="url(#hsClip)">
    <!-- high-altitude sky -->
    <circle cx="11" cy="13" r="1"   fill="#FFFFFF" opacity=".65"/>
    <circle cx="19" cy="7.5" r=".75" fill="#FFFFFF" opacity=".5"/>
    <circle cx="8"  cy="23" r=".7"  fill="#FFFFFF" opacity=".4"/>
    <circle cx="47" cy="15" r="8.5" fill="#FFFFFF" opacity=".16"/>
    <circle cx="47" cy="15" r="5.2" fill="#FFFFFF" opacity=".96"/>

    <!-- far ridges -->
    <path d="M-2 49 L13 29 L24 41 L27 49 Z" fill="#A9D4F4" opacity=".62"/>
    <path d="M36 49 L49 32 L66 49 Z" fill="#93C6EE" opacity=".55"/>

    <!-- the peak -->
    <path d="M3 64 L28 14 L61 64 Z" fill="url(#hsPeak)"/>
    <path d="M28 14 L61 64 L30 64 Z" fill="url(#hsFacet)"/>

    <!-- the route, switchbacking to the summit -->
    <path d="M35 65 C18 54 44 46 29 39 C21.5 35.5 33.5 29.5 28.5 21.5"
          fill="none" stroke="#175A96" stroke-width="4.6" stroke-linecap="round"/>
    <path d="M35 65 C18 54 44 46 29 39 C21.5 35.5 33.5 29.5 28.5 21.5"
          fill="none" stroke="#EAF5FF" stroke-width="1.1" stroke-linecap="round"
          stroke-dasharray="3.2 3.4" opacity=".85"/>
  </g>
</svg>
