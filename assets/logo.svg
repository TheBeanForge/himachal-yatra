<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 475 96" role="img" aria-label="Himachal Safar Travels">
  <title>Himachal Safar Travels</title>
  <defs>
    <linearGradient id="lkBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58ABEC"/>
      <stop offset="1" stop-color="#14528B"/>
    </linearGradient>
    <linearGradient id="lkPeak" x1="0" y1="0" x2="0" y2="1">
