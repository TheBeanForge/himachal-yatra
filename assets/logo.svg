      <stop offset="1" stop-color="#B3D7F3"/>
    </linearGradient>
    <clipPath id="lkClip"><rect x="6" y="6" width="84" height="84" rx="20"/></clipPath>
  </defs>

  <!-- mark -->
  <rect x="6" y="6" width="84" height="84" rx="20" fill="url(#lkBg)"/>
  <g clip-path="url(#lkClip)">
    <circle cx="20" cy="22" r="1.3" fill="#FFFFFF" opacity=".65"/>
    <circle cx="31" cy="15" r="1"   fill="#FFFFFF" opacity=".5"/>
    <circle cx="68" cy="26" r="11"  fill="#FFFFFF" opacity=".16"/>
    <circle cx="68" cy="26" r="6.8" fill="#FFFFFF" opacity=".96"/>
    <path d="M2 70 L22 44 L36 60 L40 70 Z" fill="#A9D4F4" opacity=".62"/>
    <path d="M52 70 L69 48 L92 70 Z" fill="#93C6EE" opacity=".55"/>
    <path d="M9 91 L43 24 L86 91 Z" fill="url(#lkPeak)"/>
    <path d="M43 24 L86 91 L45 91 Z" fill="url(#lkFacet)"/>
    <path d="M52 92 C29 78 63 67 43 57 C33 52.5 49 45 42.5 34"
